name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PdfStudio
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать проект
        working-directory: .
        run: unzip -q -o PdfStudio.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Скачать JS-библиотеки
        run: |
          npm install --no-audit --no-fund
          node scripts/copy-libs.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PDF-Studio-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-apk
          path: PdfStudio/PDF-Studio-*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PDF Студия 1.0.${{ github.run_number }}
          files: PdfStudio/PDF-Studio-*.apk
